[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-cartographer"
version = "0.1.0"
description = "Interactive antique-map visualization of how a codebase actually works"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codex Cartographer" }]
dependencies = [
    "pathspec>=0.12.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
codex-cartographer = "codex_cartographer.cli:main"

[tool.setuptools.packages.find]
include = ["codex_cartographer*"]

[tool.setuptools.package-data]
codex_cartographer = ["viz/*"]
